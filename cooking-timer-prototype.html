<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>分步做菜计时器 · 小程序交互原型</title>
<style>
  :root{
    --bg:#FFF4E3;--phone:#FFFDF8;
    --primary:#E85D04;--primary-2:#FF7A00;--accent:#2E90FA;
    --warm:#FFF2E0;--warm-2:#FFE3BF;
    --text:#2B231B;--muted:#9C8B78;--line:#F3E5D0;
    --green:#27996b;--green-bg:#e7f6ef;
    --shadow:0 18px 50px rgba(180,110,40,.2);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 15% 0%,#FFF3DE 0%,transparent 60%),radial-gradient(900px 500px at 100% 100%,#FFE7C4 0%,transparent 55%),var(--bg);
    color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:14px;
  }
  .stage-hint{width:390px;max-width:100%;text-align:center;color:#8a7a6b;font-size:12.5px;line-height:1.6}
  .stage-hint b{color:var(--primary)}

  .phone{width:390px;max-width:100%;height:844px;max-height:92vh;background:var(--phone);border-radius:46px;box-shadow:var(--shadow),0 0 0 11px #2f2a26,0 0 0 13px #4a433d;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:32px;background:#111;border-radius:20px;z-index:30}
  .statusbar{height:50px;flex:0 0 50px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;padding-top:8px;font-size:14px;font-weight:600;z-index:20}
  .statusbar .icons{display:flex;gap:6px;font-size:13px}

  .view{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .view.hidden{display:none}

  /* ---------- 列表页 ---------- */
  .list-hero{flex:0 0 auto;padding:12px 20px 15px;background:linear-gradient(135deg,#FFE9CC,#FFD7AC);border-bottom:1px solid var(--line)}
  .list-hero h1{margin:0;font-size:23px;font-weight:800;letter-spacing:.5px;color:#2B231B}
  .list-hero h1 .hero-dot{color:var(--primary-2)}
  .list-hero p{margin:4px 0 0;font-size:11.5px;color:#A85C1A;font-weight:600}
  .search-row{flex:0 0 auto;padding:12px 16px 8px;background:var(--phone)}
  .search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:0 12px;height:42px;box-shadow:0 2px 8px rgba(120,80,50,.05)}
  .search-box:focus-within{border-color:var(--primary-2)}
  .search-box .mag{font-size:16px;color:#b3a495}
  .search-box input{flex:1;border:none;outline:none;font-size:14px;color:var(--text);background:transparent}
  .search-box input::placeholder{color:#b9ac9e}
  .search-box .clear{border:none;background:#F2E4CF;color:#8a7a6b;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:none;line-height:1}
  .cat-row{flex:0 0 auto;display:flex;gap:7px;padding:2px 16px 10px;overflow-x:auto;background:var(--phone)}
  .cat-row::-webkit-scrollbar{display:none}
  .cat{border:1px solid var(--line);background:#fff;color:#8a7a6b;border-radius:20px;padding:6px 13px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;transition:.15s}
  .cat.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .dish-scroll{flex:1 1 auto;overflow-y:auto;padding:2px 16px 20px}
  .dish-scroll::-webkit-scrollbar{width:0}
  .result-tip{font-size:11.5px;color:var(--muted);margin:2px 2px 10px}
  .dish-card{display:flex;gap:13px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:17px;padding:12px;margin-bottom:11px;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
  .dish-card:hover{border-color:#FFC48A;box-shadow:0 6px 18px rgba(255,122,0,.16)}
  .dish-card:active{transform:scale(.98)}
  .dish-img{width:76px;height:76px;flex:0 0 76px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:39px;box-shadow:inset 0 2px 6px rgba(255,255,255,.3);position:relative;overflow:hidden}
  .dish-img::after{content:"";position:absolute;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 70%);top:-16px;left:-10px}
  .dish-info{flex:1;min-width:0}
  .dish-title-row{display:flex;align-items:center;gap:7px;margin-bottom:3px}
  .dish-info h3{margin:0;font-size:17px;font-weight:800;letter-spacing:.3px;color:#2B231B}
  .dish-progress{font-size:9.5px;font-weight:700;color:var(--green);background:var(--green-bg);border-radius:8px;padding:2px 6px;white-space:nowrap}
  .dish-sub{font-size:11px;color:#a89a8c;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dish-meta{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted)}
  .dish-meta .meta-time{color:var(--primary);background:var(--warm);border-radius:7px;padding:3px 7px;font-weight:700}
  .dish-meta>span+span{position:relative;padding-left:7px}
  .dish-meta>span+span::before{content:"";position:absolute;left:0;top:50%;width:2px;height:2px;border-radius:50%;background:#cbbdb0;transform:translateY(-50%)}
  .dish-arrow{color:#d3c6b8;font-size:22px;flex:0 0 auto}
  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .e-icon{font-size:48px;margin-bottom:10px}
  .empty h4{margin:0 0 6px;color:#6f6053;font-size:15px}
  .empty p{margin:0;font-size:12px;line-height:1.6}

  /* ---------- 详情页 ---------- */
  .hero{flex:0 0 auto;padding:9px 20px 14px;background:linear-gradient(135deg,#FFE9CC,#FFD7AC);border-bottom:1px solid var(--line)}
  .hero-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
  .back-btn{border:none;background:rgba(255,255,255,.82);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--primary);cursor:pointer;display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 6px rgba(180,110,40,.1)}
  .back-btn:active{transform:scale(.95)}
  .nav-text-btn{border:none;background:transparent;color:#A85C1A;font-size:11px;font-weight:600;cursor:pointer;padding:4px 6px;opacity:.8}
  .nav-text-btn:hover{opacity:1;color:var(--primary)}
  .hero-top{display:flex;gap:13px;align-items:center}
  .hero .dish-img{width:58px;height:58px;flex:0 0 58px;border-radius:14px;font-size:30px}
  .hero-info{flex:1;min-width:0}
  .hero-info h1{font-size:22px;font-weight:800;margin:0 0 3px;line-height:1.2}
  .hero-info .sub{font-size:11.5px;color:#A85C1A;line-height:1.4}
  .meta{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .chip{background:rgba(255,255,255,.78);border:1px solid rgba(255,122,0,.18);color:#B85A1E;font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:700}
  .progress-wrap{margin-top:11px}
  .progress-label{display:flex;justify-content:space-between;font-size:11px;color:#A85C1A;margin-bottom:6px;font-weight:600}
  .progress-label b{color:var(--primary);font-size:13px}
  .progress-track{height:7px;background:rgba(255,255,255,.8);border-radius:8px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(120,60,30,.08)}
  .progress-fill{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--primary-2));transition:width .5s cubic-bezier(.4,0,.2,1)}

  .scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:14px 16px 24px;scroll-behavior:smooth}
  .scroll::-webkit-scrollbar{width:0}

  /* 唯一聚焦计时卡 —— 页面唯一视觉主角，单一 CTA */
  .focus-card{background:#fff;border:1.5px solid var(--warm-2);border-radius:24px;padding:20px 18px 16px;margin-bottom:16px;box-shadow:0 14px 34px rgba(242,86,0,.14);position:relative;overflow:hidden}
  .focus-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--primary-2))}
  .focus-top{display:flex;justify-content:space-between;align-items:center;margin:2px 0 6px}
  .focus-step{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--primary);background:var(--warm);padding:4px 10px;border-radius:8px}
  .focus-status{font-size:11px;color:var(--muted);font-weight:600}
  .focus-title{font-size:24px;font-weight:800;margin:0 0 5px;letter-spacing:.3px}
  .focus-desc{font-size:12px;color:#9C8B78;line-height:1.55;margin:0 0 4px}
  .focus-ring-wrap{position:relative;width:196px;height:196px;margin:8px auto 6px}
  .focus-ring-wrap svg{transform:rotate(-90deg)}
  .focus-ring-bg{fill:none;stroke:#F5EADA;stroke-width:8}
  .focus-ring-fg{fill:none;stroke:var(--primary-2);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .4s linear,stroke .3s}
  .focus-time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--primary);letter-spacing:1px}
  .focus-time small{font-size:10px;color:var(--muted);font-weight:600;margin-top:4px;letter-spacing:1px}
  /* 时长调整：轻量文字链，不作为按钮存在 */
  .focus-edit{text-align:center;margin:0 0 14px}
  .focus-val{border:none;background:transparent;color:#9C8B78;font-size:12px;font-weight:600;cursor:pointer;padding:6px 12px;border-radius:8px}
  .focus-val:hover{background:var(--warm);color:var(--primary)}
  .focus-val b{color:var(--primary-2);font-weight:800;font-variant-numeric:tabular-nums;margin:0 2px}
  /* 唯一主 CTA —— 全页只此一个实心按钮 */
  .focus-actions{display:flex;flex-direction:column;align-items:center;gap:5px}
  .btn{border:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-weight:700;line-height:1;transition:transform .16s ease,box-shadow .2s ease,filter .2s ease,background .2s ease}
  .btn:active{transform:scale(.97)}
  .btn:disabled{cursor:default;opacity:.55;filter:grayscale(.4)}
  .btn svg{width:16px;height:16px;flex:none}
  .f-main{width:100%;min-height:48px;border-radius:13px;padding:0;font-size:15px;color:#fff;background:linear-gradient(135deg,#FF9A3D,#F25600);box-shadow:0 6px 16px rgba(242,86,0,.3),inset 0 1px 0 rgba(255,255,255,.28);letter-spacing:.5px}
  .f-main:hover:not(:disabled){filter:brightness(1.05);box-shadow:0 8px 20px rgba(242,86,0,.4),inset 0 1px 0 rgba(255,255,255,.28)}
  .f-main.paused{background:linear-gradient(135deg,#FFC93D,#FF9500);box-shadow:0 6px 16px rgba(255,149,0,.32),inset 0 1px 0 rgba(255,255,255,.3)}
  /* 完成本步：次要文字链，不抢焦点 */
  .f-done{border:none;background:transparent;color:#b3a495;font-size:11.5px;font-weight:600;cursor:pointer;padding:5px 12px}
  .f-done:hover{color:var(--primary)}

  /* 步骤清单 —— 弱化配角，辅助导航 */
  .steps-section{background:#FBF7F1;border:1px solid var(--line);border-radius:18px;padding:12px 12px 5px}
  .list-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}
  .list-head h2{font-size:13px;margin:0;color:#8a7a6b;font-weight:700}
  .list-head h2 .h2-sub{font-size:10.5px;color:#b3a495;font-weight:500;margin-left:5px}
  .auto-toggle{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#9C8B78;cursor:pointer;user-select:none}
  .switch{width:38px;height:22px;border-radius:20px;background:#E3D7C6;position:relative;transition:.25s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .auto-toggle.on .switch{background:var(--green)}
  .auto-toggle.on .switch::after{transform:translateX(16px)}
  .step-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:.2s}
  .step-row:hover{border-color:#FFC48A}
  .step-row.active{border-color:var(--primary-2);border-width:1.5px;background:#FFF8EF;box-shadow:0 3px 12px rgba(255,122,0,.12)}
  .step-row.done{opacity:.55}
  .step-row.done .sr-title{text-decoration:line-through;color:#8d8073}
  .sr-no{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:var(--warm-2);color:var(--primary);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;transition:.2s}
  .step-row.active .sr-no{background:var(--primary-2);color:#fff}
  .step-row.done .sr-no{background:var(--green);color:#fff}
  .sr-body{flex:1;min-width:0}
  .sr-title{font-size:13.5px;font-weight:700;margin-bottom:3px;display:flex;gap:6px;align-items:center}
  .sr-sub{font-size:11px;color:var(--muted)}
  .sr-state{font-size:10px;font-weight:700;color:#9C8B78;background:#F5EFE6;padding:3px 8px;border-radius:10px;flex:none}
  .step-row.active .sr-state{color:var(--primary);background:var(--warm)}
  .step-row.done .sr-state{color:var(--green);background:var(--green-bg)}
  .custom-badge{font-size:9px;font-weight:700;color:#2E90FA;background:#E9F3FF;border:1px solid #BBD9FF;padding:1px 6px;border-radius:8px}

  /* ---------- 弹窗 ---------- */
  .overlay{position:absolute;inset:0;z-index:50;background:rgba(43,36,29,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .28s}
  .overlay.show{opacity:1;pointer-events:auto}
  .modal{width:300px;background:#fff;border-radius:26px;padding:28px 24px 22px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.25);transform:translateY(18px) scale(.94);transition:transform .3s cubic-bezier(.2,1.3,.4,1)}
  .overlay.show .modal{transform:translateY(0) scale(1)}
  .modal-icon{font-size:56px;line-height:1;animation:pop .6s ease}
  @keyframes pop{0%{transform:scale(.4) rotate(-15deg)}60%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
  .modal h3{font-size:20px;margin:12px 0 6px}
  .modal p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 20px}
  .modal .btn-main{width:100%;padding:13px;font-size:14px;line-height:1.4;border-radius:13px;background:linear-gradient(135deg,#FF9A3D,#F56600);color:#fff;box-shadow:0 4px 12px rgba(255,122,0,.34)}
  .modal .btn-sub{width:100%;margin-top:9px;padding:11px;border:none;background:transparent;color:var(--muted);font-size:13px;cursor:pointer}
  .time-modal{width:290px}
  .field-row{display:flex;gap:10px;margin:16px 0}
  .field{flex:1}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px;text-align:center;font-size:20px;font-weight:800;color:var(--primary);background:#FFF7EC;outline:none}
  .field input:focus{border-color:var(--primary-2)}
  .quick-row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
  .quick-row button{border:1px solid var(--line);background:var(--warm);color:#8a6a52;border-radius:20px;padding:6px 12px;font-size:11.5px;font-weight:700;cursor:pointer}
  .quick-row button:active{transform:scale(.94);background:var(--warm-2)}
  .done-overlay .modal-icon{animation:pop .6s ease,float 2.5s ease-in-out .6s infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);background:rgba(43,36,29,.9);color:#fff;padding:9px 18px;border-radius:20px;font-size:12.5px;z-index:60;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="stage-hint">🍳 <b>分步做菜计时器</b> · 多菜谱可交互原型 — 搜索选菜 → 一次只聚焦当前一步 → 自定义时间 → 到点提醒 → 自动进入下一步</div>

<div class="phone">
  <div class="island"></div>
  <div class="statusbar"><span>9:41</span><span class="icons">📶 🔋 100%</span></div>

  <!-- ============ 列表页 ============ -->
  <div class="view" id="viewList">
    <div class="list-hero">
      <h1>今天做什么菜<span class="hero-dot">。</span></h1>
      <p>12 道家常菜 · 分步计时，跟着做零失败</p>
    </div>
    <div class="search-row">
      <div class="search-box">
        <span class="mag">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索菜名，如 红烧肉 / 鸡翅 / 豆腐" autocomplete="off" />
        <button class="clear" id="clearSearch">✕</button>
      </div>
    </div>
    <div class="cat-row" id="catRow"></div>
    <div class="dish-scroll">
      <div class="result-tip" id="resultTip"></div>
      <div id="dishList"></div>
    </div>
  </div>

  <!-- ============ 详情页 ============ -->
  <div class="view hidden" id="viewDetail">
    <div class="hero">
      <div class="hero-nav">
        <button class="back-btn" id="backBtn">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          菜谱列表
        </button>
        <button class="nav-text-btn" id="resetAll">重置全部</button>
      </div>
      <div class="hero-top">
        <div class="dish-img" id="detailImg">🥘</div>
        <div class="hero-info">
          <h1 id="detailName">红烧肉</h1>
          <div class="sub" id="detailDesc"></div>
          <div class="meta" id="detailMeta"></div>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-label"><span>烹饪进度</span><span><b id="doneCount">0</b> / <span id="totalSteps">8</span> 步完成</span></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </div>
    <div class="scroll" id="scroll">
      <!-- 唯一计时卡 -->
      <div class="focus-card">
        <div class="focus-top"><span class="focus-step" id="focusStep">第 1 / 8 步</span><span class="focus-status" id="focusStatus">准备就绪</span></div>
        <div class="focus-title" id="focusTitle">准备食材</div>
        <div class="focus-desc" id="focusDesc"></div>
        <div class="focus-ring-wrap">
          <svg width="196" height="196" viewBox="0 0 120 120">
            <circle class="focus-ring-bg" cx="60" cy="60" r="52"></circle>
            <circle class="focus-ring-fg" id="focusRing" cx="60" cy="60" r="52" stroke-dasharray="327" stroke-dashoffset="0"></circle>
          </svg>
          <div class="focus-time" id="focusTime">10:00<small>剩余时间</small></div>
        </div>
        <div class="focus-edit">
          <span class="focus-val" id="fVal" title="点击调整本步时长">本步时长 <b>10:00</b> · 调整 ›</span>
        </div>
        <div class="focus-actions">
          <button class="btn f-main" id="fToggle">
            <svg id="fToggleIcon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
            <span id="fToggleLabel">开始计时</span>
          </button>
          <button class="f-done" id="fDone">跳过本步 ›</button>
        </div>
      </div>
      <div class="steps-section">
        <div class="list-head">
          <h2>全部步骤<span class="h2-sub">点按可切换当前步</span></h2>
          <div class="auto-toggle on" id="autoToggle"><span>到点自动下一步</span><div class="switch"></div></div>
        </div>
        <div id="stepList"></div>
      </div>
    </div>
  </div>

  <!-- 到点提醒 -->
  <div class="overlay" id="timeupOverlay">
    <div class="modal">
      <div class="modal-icon">⏰</div>
      <h3>时间到啦！</h3>
      <p id="timeupText"></p>
      <button class="btn btn-main" id="nextStepBtn">完成，进入下一步 →</button>
      <button class="btn-sub" id="stayBtn">先等一下</button>
    </div>
  </div>

  <!-- 时间设置 -->
  <div class="overlay" id="timeOverlay">
    <div class="modal time-modal">
      <div class="modal-icon" style="font-size:42px">⚙️</div>
      <h3 style="font-size:18px">设置本步时长</h3>

      <div class="modal-icon">🎉</div>
      <h3 id="doneTitle">红烧肉完成啦！</h3>
      <p id="doneText">色香味俱全，快叫家人来开饭吧～</p>
      <button class="btn btn-main" id="cookAgainBtn">再做一次</button>
      <button class="btn-sub" id="backListBtn">返回菜谱列表</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  "use strict";

  /* ================= 菜谱数据 ================= */
  var DISHES=[
    {id:"hr",name:"红烧肉",icon:"🥘",g:["#d8442f","#a8271b"],desc:"肥而不腻·入口即化",diff:"中等",cats:["家常","炖煮"],tags:["经典","下饭"],
     steps:[["准备食材","五花肉 500g 切 2cm 见方块，姜切片葱切段，备八角桂皮冰糖。",600],["焯水去腥","冷水下锅加姜片料酒，大火煮开撇浮沫，煮 2 分钟捞出洗净。",480],["炒糖色","锅中少油下冰糖，小火炒至融化呈枣红色，下肉块翻炒裹匀上色。",360],["煸炒出香","加姜片八角桂皮炒香，翻炒至肉块表面微黄、逼出部分油脂。",300],["加料炖煮","加生抽 2 勺老抽 1 勺料酒 1 勺，倒入开水没过肉，大火烧开。",300],["小火慢炖","转小火加盖慢炖，直到肉质软烂、筷子能轻松插入。",1800],["大火收汁","开大火收汁，不停翻动让汤汁浓稠挂在肉上，收至油亮红润。",600],["出锅装盘","拣出香料撒葱花，装盘上桌趁热享用。",120]]},
    {id:"fq",name:"番茄炒蛋",icon:"🍅",g:["#f2994a","#e3503b"],desc:"酸甜开胃·5分钟快手",diff:"简单",cats:["家常","快手"],tags:["快手","素菜"],
     steps:[["准备食材","番茄 2 个切块，鸡蛋 3 个打散，葱切花备用。",180],["炒鸡蛋","热油下蛋液，凝固后快速划散盛出。",180],["炒番茄","锅中留底油下番茄，中火翻炒出沙汁。",240],["合炒调味","倒回鸡蛋，加盐糖少许翻炒均匀。",120],["出锅","撒葱花装盘。",60]]},
    {id:"tp",name:"糖醋排骨",icon:"🍖",g:["#e17b44","#c0562b"],desc:"酸甜酥脆·孩子最爱",diff:"中等",cats:["家常","炖煮"],tags:["经典","糖醋"],
     steps:[["排骨焯水","排骨冷水下锅加姜料酒，煮开撇沫捞出洗净。",420],["煎排骨","少油下排骨煎至两面金黄。",360],["调糖醋汁","料酒1生抽2糖3醋4清水5，按比例调匀。",180],["焖煮入味","倒入糖醋汁没过排骨，大火烧开转小火焖煮。",900],["大火收汁","收汁至浓稠包裹排骨，撒白芝麻。",300]]},
    {id:"gb",name:"宫保鸡丁",icon:"🍗",g:["#d98c3f","#b5651d"],desc:"麻辣鲜香·下饭神器",diff:"中等",cats:["家常","快手"],tags:["川菜","下饭"],
     steps:[["切配食材","鸡胸肉切丁，黄瓜胡萝卜切丁，葱切段。",300],["腌制鸡丁","鸡丁加料酒生抽淀粉抓匀腌 10 分钟。",600],["炒花生米","冷油下花生米小火炸香盛出。",240],["爆炒鸡丁","热油下鸡丁滑炒至变色盛出。",180],["调味合炒","爆香花椒干辣椒，下鸡丁蔬菜，倒入碗汁翻炒，加花生米出锅。",300]]},
    {id:"mp",name:"麻婆豆腐",icon:"🍲",g:["#cf5b3a","#a83f22"],desc:"麻辣嫩滑·川味经典",diff:"简单",cats:["家常","快手","素菜"],tags:["川菜","下饭"],
     steps:[["切配食材","嫩豆腐切方块，肉末备好，蒜苗切碎。",240],["豆腐焯水","盐水焯豆腐 1 分钟去豆腥、不易碎。",120],["炒肉末","热油下肉末炒散，加豆瓣酱炒出红油。",240],["烧豆腐","加水没过豆腐，轻推烧开入味。",300],["勾芡出锅","分次水淀粉勾芡，撒花椒粉蒜苗出锅。",120]]},
    {id:"kl",name:"可乐鸡翅",icon:"🍗",g:["#b5651d","#8b4513"],desc:"甜香软烂·零失败",diff:"简单",cats:["家常","快手"],tags:["快手","孩子爱"],
     steps:[["处理鸡翅","鸡翅两面划刀，冷水下锅焯水去血沫捞出。",420],["煎鸡翅","少油煎至两面金黄。",300],["倒可乐焖煮","倒入可乐没过鸡翅，加生抽姜片，大火烧开转中火。",900],["大火收汁","收汁至浓稠油亮，撒芝麻出锅。",300]]},
    {id:"qz",name:"清蒸鲈鱼",icon:"🐟",g:["#6aa9c9","#3f7fa8"],desc:"鲜嫩多汁·原汁原味",diff:"中等",cats:["家常","蒸菜"],tags:["清淡","宴客"],
     steps:[["处理鲈鱼","鲈鱼收拾干净，两面划几刀，姜葱塞鱼腹。",360],["腌制去腥","抹料酒少许盐，铺姜片腌 10 分钟。",600],["上锅蒸","水开后上锅大火蒸 8 分钟，关火虚蒸 2 分钟。",600],["淋汁激香","倒掉盘中腥水，铺葱丝淋蒸鱼豉油，浇热油激香。",180]]},
    {id:"hg",name:"回锅肉",icon:"🥓",g:["#cc6b3f","#a04b28"],desc:"香辣下饭·川菜之王",diff:"中等",cats:["家常","快手"],tags:["川菜","下饭"],
     steps:[["煮肉","五花肉冷水下锅加姜葱料酒，煮至筷子能插入。",900],["切薄片","肉放凉切薄片，青椒蒜苗切段。",240],["煸炒出油","少油下肉片煸至卷曲出油、呈灯盏窝。",300],["炒香豆瓣","加豆瓣酱甜面酱炒出红油。",120],["合炒出锅","下青椒蒜苗断生出锅。",120]]},
    {id:"yx",name:"鱼香肉丝",icon:"🥢",g:["#c97b4a","#9c4f2c"],desc:"鱼香味浓·酸甜辣鲜",diff:"中等",cats:["家常","快手"],tags:["川菜","下饭"],
     steps:[["切配腌肉","里脊肉切丝加料酒淀粉抓匀，木耳胡萝卜笋切丝。",360],["调鱼香汁","糖醋生抽淀粉水调匀，比例是关键。",180],["滑炒肉丝","热油下肉丝滑炒至变色盛出。",180],["炒配菜","爆香泡椒姜蒜，下配菜翻炒断生。",180],["合炒收汁","倒回肉丝淋鱼香汁，大火收汁撒葱花。",180]]},
    {id:"sl",name:"蒜蓉西兰花",icon:"🥦",g:["#7cb342","#4e8b2a"],desc:"清爽脆嫩·减脂首选",diff:"简单",cats:["素菜","快手"],tags:["清淡","减脂"],
     steps:[["准备食材","西兰花掰小朵洗净，蒜切末。",180],["焯水","水开加盐油，焯西兰花 1 分钟捞出过凉。",120],["炒蒜蓉","热油爆香一半蒜末。",60],["翻炒调味","下西兰花大火翻炒，加盐和剩余蒜末出锅。",120]]},
    {id:"pz",name:"皮蛋瘦肉粥",icon:"🥣",g:["#d4a373","#b5834a"],desc:"绵滑暖胃·早餐佳品",diff:"简单",cats:["汤粥"],tags:["早餐","清淡"],
     steps:[["熬粥底","大米淘洗加水，大火烧开转小火熬煮。",1800],["切配食材","皮蛋切丁，瘦肉切丝加淀粉抓匀，姜切丝。",300],["下料","粥底粘稠后下皮蛋瘦肉丝，煮至肉变色。",420],["调味出锅","加盐胡椒粉葱花搅匀出锅。",120]]},
    {id:"sz",name:"水煮牛肉",icon:"🌶️",g:["#d64541","#a52a2a"],desc:"麻辣滚烫·豪横过瘾",diff:"中等",cats:["家常"],tags:["川菜","重口"],
     steps:[["切配腌肉","牛里脊切薄片，加料酒生抽蛋清淀粉抓匀腌 15 分钟。",900],["炒底料","爆香豆瓣酱花椒干辣椒，加高汤烧开。",300],["涮牛肉","下豆芽配菜烫熟垫底，牛肉片逐片下锅烫熟连汤倒入。",420],["淋油激香","撒辣椒面花椒蒜末，浇热油激香撒香菜。",120]]}
  ];

  function fmt(sec){sec=Math.max(0,Math.floor(sec));var m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
  function durText(sec){var m=Math.round(sec/60);return m>=60?(Math.floor(m/60)+"小时"+(m%60?m%60+"分":"")):(m+"分钟");}
  function $(id){return document.getElementById(id);}
  function toast(msg){var t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("show");},1800);}

  /* ================= 运行时状态（每道菜独立） ================= */
  var runtime={};
  function getRT(d){
    if(!runtime[d.id]){
      runtime[d.id]={steps:d.steps.map(function(s,i){return {idx:i,name:s[0],desc:s[1],def:s[2],duration:s[2],remain:s[2],running:false,done:false,endAt:0,timer:null};}),activeIdx:0,autoNext:true};
    }
    return runtime[d.id];
  }
  var currentDish=null, RT=null;
  var timeupStep=-1, editingIdx=-1;
  var CATS=["全部","家常","快手","炖煮","素菜","蒸菜","汤粥"];

  /* ================= 列表页 ================= */
  function renderCats(){
    $("catRow").innerHTML=CATS.map(function(c){return '<button class="cat'+(c===activeCat?' on':'')+'" data-cat="'+c+'">'+c+'</button>';}).join("");
    $("catRow").querySelectorAll(".cat").forEach(function(b){b.addEventListener("click",function(){activeCat=b.dataset.cat;renderCats();renderDishes();});});
  }
  var activeCat="全部";
  function renderDishes(){
    var kw=$("searchInput").value.trim().toLowerCase();
    $("clearSearch").style.display=kw?"block":"none";
    var list=DISHES.filter(function(d){
      var catOk=(activeCat==="全部"||d.cats.indexOf(activeCat)>=0);
      var hay=(d.name+" "+d.desc+" "+d.cats.join(" ")+" "+d.tags.join(" ")+" "+d.steps.map(function(s){return s[0];}).join(" ")).toLowerCase();
      return catOk && (!kw||hay.indexOf(kw)>=0);
    });
    var total=DISHES.reduce(function(a,d){return a+d.steps.reduce(function(x,s){return x+s[2];},0);},0);
    $("resultTip").textContent=kw||activeCat!=="全部"?("找到 "+list.length+" 道菜"):("共 "+DISHES.length+" 道菜 · 总时长约 "+durText(total/2));
    if(!list.length){
      $("dishList").innerHTML='<div class="empty"><div class="e-icon">🔍</div><h4>没找到相关菜谱</h4><p>换个关键词试试，比如「鸡蛋」「豆腐」「川菜」</p></div>';
      return;
    }
    $("dishList").innerHTML=list.map(function(d){
      var t=d.steps.reduce(function(a,s){return a+s[2];},0);
      var done=getRT(d).steps.filter(function(s){return s.done;}).length;
      return '<div class="dish-card" data-id="'+d.id+'">'+
        '<div class="dish-img" style="background:linear-gradient(145deg,'+d.g[0]+','+d.g[1]+')">'+d.icon+'</div>'+
        '<div class="dish-info">'+
          '<div class="dish-title-row"><h3>'+d.name+'</h3>'+(done?'<span class="dish-progress">已做 '+done+'/'+d.steps.length+'</span>':'')+'</div>'+
          '<div class="dish-sub">'+d.desc+'</div>'+
          '<div class="dish-meta"><span class="meta-time">⏱ '+durText(t)+'</span><span>'+d.diff+'</span><span>'+d.steps.length+' 步</span></div>'+
        '</div>'+
        '<div class="dish-arrow">›</div></div>';
    }).join("");
    $("dishList").querySelectorAll(".dish-card").forEach(function(c){c.addEventListener("click",function(){openDish(c.dataset.id);});});
  }
  $("searchInput").addEventListener("input",renderDishes);
  $("clearSearch").addEventListener("click",function(){$("searchInput").value="";renderDishes();$("searchInput").focus();});

  /* ================= 打开/返回详情 ================= */
  function openDish(id){
    currentDish=DISHES.filter(function(d){return d.id===id;})[0];
    RT=getRT(currentDish);
    var first=RT.steps.findIndex(function(s){return !s.done;});
    RT.activeIdx=first<0?0:first;
    $("viewList").classList.add("hidden");
    $("viewDetail").classList.remove("hidden");
    $("detailImg").textContent=currentDish.icon;
    $("detailImg").style.background="linear-gradient(145deg,"+currentDish.g[0]+","+currentDish.g[1]+")";
    $("detailName").textContent=currentDish.name;
    $("detailDesc").textContent=currentDish.desc;
    var total=RT.steps.reduce(function(a,s){return a+s.def;},0);
    $("detailMeta").innerHTML='<span class="chip">⏱ 约 '+durText(total)+'</span><span class="chip">🔥 '+currentDish.diff+'</span><span class="chip">🍽 2-3 人份</span>';
    $("totalSteps").textContent=RT.steps.length;
    $("autoToggle").classList.toggle("on",RT.autoNext);
    buildSteps();renderAllRows();renderFocus();renderProgress();
    $("scroll").scrollTo({top:0});
  }
  function backToList(){
    if(RT)RT.steps.forEach(function(_,i){pauseAt(i);});
    currentDish=null;RT=null;
    $("viewDetail").classList.add("hidden");
    $("viewList").classList.remove("hidden");
    renderDishes();
  }
  $("backBtn").addEventListener("click",backToList);

  /* ================= 步骤清单渲染（无计时器） ================= */
  function buildSteps(){
    $("stepList").innerHTML=RT.steps.map(function(s){
      return '<div class="step-row" data-idx="'+s.idx+'" id="row-'+s.idx+'">'+
        '<div class="sr-no" id="srno-'+s.idx+'">'+(s.idx+1)+'</div>'+
        '<div class="sr-body"><div class="sr-title"><span>'+s.name+'</span><span class="custom-badge" id="srbadge-'+s.idx+'" style="display:none">改</span></div>'+
        '<div class="sr-sub" id="srsub-'+s.idx+'">⏱ '+fmt(s.duration)+'</div></div>'+
        '<div class="sr-state" id="srstate-'+s.idx+'">待做</div></div>';
    }).join("");
    $("stepList").querySelectorAll(".step-row").forEach(function(el){
      el.addEventListener("click",function(){setCurrent(+el.dataset.idx);});
    });
  }
  function renderRow(i){
    if(!RT)return;var s=RT.steps[i],row=$("row-"+i);if(!row)return;
    row.classList.toggle("done",s.done);
    row.classList.toggle("active",i===RT.activeIdx&&!s.done);
    $("srno-"+i).textContent=s.done?"✓":(i+1);
    $("srbadge-"+i).style.display=(s.duration!==s.def)?"inline-block":"none";
    $("srsub-"+i).textContent="⏱ "+fmt(s.duration)+(s.duration!==s.def?" · 默认 "+fmt(s.def):"");
    $("srstate-"+i).textContent=s.done?"已完成":(i===RT.activeIdx?"当前":"待做");
  }
  function renderAllRows(){if(RT)RT.steps.forEach(function(_,i){renderRow(i);});}
  function renderProgress(){
    if(!RT)return;var done=RT.steps.filter(function(s){return s.done;}).length;
    $("doneCount").textContent=done;
    $("progressFill").style.width=(done/RT.steps.length*100)+"%";
  }

  /* ================= 唯一计时卡渲染 ================= */
  function renderFocus(){
    if(!RT||RT.activeIdx<0)return;
    var s=RT.steps[RT.activeIdx];
    $("focusStep").textContent="第 "+(RT.activeIdx+1)+" / "+RT.steps.length+" 步";
    $("focusTitle").textContent=s.name;
    $("focusDesc").textContent=s.desc;
    $("focusStatus").textContent=s.done?"已完成":(s.running?"计时中…":(s.remain<s.duration&&s.remain>0?"已暂停":"准备就绪"));
    $("focusTime").innerHTML=fmt(s.remain)+(s.done?"":"<small>剩余时间</small>");
    $("fVal").innerHTML="本步时长 <b>"+fmt(s.duration)+"</b> · 调整 ›";
    var C=2*Math.PI*52,ratio=s.duration>0?s.remain/s.duration:0;
    var ring=$("focusRing");
    ring.style.strokeDashoffset=String(C*(1-ratio));
    ring.style.stroke=s.done?"var(--green)":"var(--primary-2)";
    var tg=$("fToggle"), tIcon=$("fToggleIcon"), tLabel=$("fToggleLabel");
    var playPath="M8 5.5v13l11-6.5z", pausePath="M7 5h3.4v14H7zm6.6 0H17v14h-3.4z", checkPath="M5 12.5l4.5 4.5L19 7";
    if(s.done){tIcon.innerHTML='<path d="'+checkPath+'"/>';tIcon.setAttribute("fill","none");tIcon.setAttribute("stroke","currentColor");tIcon.setAttribute("stroke-width","2.6");tIcon.setAttribute("stroke-linecap","round");tIcon.setAttribute("stroke-linejoin","round");tLabel.textContent="已完成";}
    else if(s.running){tIcon.innerHTML='<path d="'+pausePath+'"/>';tIcon.setAttribute("fill","currentColor");tIcon.removeAttribute("stroke");tLabel.textContent="暂停计时";}
    else if(s.remain<s.duration&&s.remain>0){tIcon.innerHTML='<path d="'+playPath+'"/>';tIcon.setAttribute("fill","currentColor");tIcon.removeAttribute("stroke");tLabel.textContent="继续计时";}
    else {tIcon.innerHTML='<path d="'+playPath+'"/>';tIcon.setAttribute("fill","currentColor");tIcon.removeAttribute("stroke");tLabel.textContent="开始计时";}
    tg.classList.toggle("paused",!s.running&&s.remain<s.duration&&s.remain>0&&!s.done);
    tg.disabled=!!s.done;
    $("fDone").style.display=s.done?"none":"";
  }

  /* ================= 计时逻辑（只作用于当前步） ================= */
  function pauseAt(i){
    if(!RT)return;var s=RT.steps[i];if(!s.running)return;
    s.remain=Math.max(0,Math.ceil((s.endAt-Date.now())/1000));
    s.running=false;clearInterval(s.timer);s.timer=null;
  }
  function setCurrent(i){
    if(!RT)return;
    if(RT.activeIdx>=0&&RT.activeIdx!==i)pauseAt(RT.activeIdx);
    RT.activeIdx=i;renderAllRows();renderFocus();
    $("scroll").scrollTo({top:0,behavior:"smooth"});
    toast("已切换到第 "+(i+1)+" 步 · "+RT.steps[i].name);
  }
  function startTimer(){
    if(!RT||RT.activeIdx<0)return;
    var i=RT.activeIdx,s=RT.steps[i];if(s.done)return;
    if(s.remain<=0)s.remain=s.duration;
    RT.steps.forEach(function(_,j){if(j!==i)pauseAt(j);});
    s.running=true;s.endAt=Date.now()+s.remain*1000;
    var dishId=currentDish.id;
    s.timer=setInterval(function(){
      s.remain=Math.max(0,Math.ceil((s.endAt-Date.now())/1000));
      if(currentDish&&currentDish.id===dishId&&RT.activeIdx===i)renderFocus();
      if(s.remain<=0){clearInterval(s.timer);s.timer=null;s.running=false;onTimeUp(i,dishId);}
    },200);
    renderFocus();renderRow(i);ensureAudio();
  }
  function pauseCurrent(){if(RT&&RT.activeIdx>=0){pauseAt(RT.activeIdx);renderFocus();renderRow(RT.activeIdx);}}
  function toggleCurrent(){if(!RT||RT.activeIdx<0)return;RT.steps[RT.activeIdx].running?pauseCurrent():startTimer();}
  function resetCurrent(){
    if(!RT||RT.activeIdx<0)return;var i=RT.activeIdx,s=RT.steps[i];
    pauseAt(i);s.remain=s.duration;s.done=false;
    renderFocus();renderRow(i);renderProgress();toast("已重置第 "+(i+1)+" 步");
  }
  function adjustCurrent(d){
    if(!RT||RT.activeIdx<0)return;var i=RT.activeIdx,s=RT.steps[i];
    var nd=Math.max(5,Math.min(180*60,s.duration+d));s.duration=nd;if(!s.running)s.remain=nd;
    renderFocus();renderRow(i);toast("第 "+(i+1)+" 步设为 "+fmt(nd));
  }

  /* ================= 提醒 ================= */
  function ensureAudio(){
    try{
      if(!window._actx){var C=window.AudioContext||window.webkitAudioContext;if(C)window._actx=new C();}
      if(window._actx&&window._actx.state==="suspended")window._actx.resume();
      if("Notification" in window&&Notification.permission==="default")Notification.requestPermission();
    }catch(e){}
  }
  function playChime(){
    try{var ctx=window._actx;if(!ctx)return;[880,1109,1319,1760].forEach(function(f,k){var o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+k*0.22;o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.32,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.55);});}catch(e){}
  }
  function onTimeUp(i,dishId){
    var s=runtime[dishId].steps[i];timeupStep=i;
    playChime();
    if(navigator.vibrate)navigator.vibrate([300,120,300,120,500]);
    if("Notification" in window&&Notification.permission==="granted"){try{var dname=(currentDish&&currentDish.id===dishId)?currentDish.name:"做菜计时";new Notification("⏰ "+dname+" · 时间到",{body:"「"+s.name+"」完成，去进行下一步吧"});}catch(e){}}
    $("timeupText").innerHTML="「<b>"+s.name+"</b>」时间到啦，快去看看～";
    $("timeupOverlay").classList.add("show");
    if(RT.autoNext){clearTimeout(window._autoNextT);window._autoNextT=setTimeout(function(){if($("timeupOverlay").classList.contains("show"))completeAndNext();},8000);}
  }
  function completeAndNext(){
    clearTimeout(window._autoNextT);$("timeupOverlay").classList.remove("show");
    var i=timeupStep;if(i<0||!RT)return;
    var s=RT.steps[i];pauseAt(i);s.done=true;
    renderRow(i);renderProgress();
    var next=RT.steps.findIndex(function(x){return !x.done;});
    if(next===-1){renderFocus();showDone();timeupStep=-1;return;}
    RT.activeIdx=next;
    var ns=RT.steps[next];if(ns.remain<=0)ns.remain=ns.duration;
    renderAllRows();renderFocus();
    $("scroll").scrollTo({top:0,behavior:"smooth"});
    toast("接下来：第 "+(next+1)+" 步 · "+ns.name);
    timeupStep=-1;
  }
  function finishCurrent(){
    if(!RT||RT.activeIdx<0)return;
    var s=RT.steps[RT.activeIdx];if(s.done){toast("这一步已完成");return;}
    timeupStep=RT.activeIdx;completeAndNext();
  }
  function showDone(){
    $("doneTitle").textContent=currentDish.name+"完成啦！";
    $("doneText").innerHTML="色香味俱全，快叫家人来开饭吧～<br>共完成 "+RT.steps.length+" 个步骤，辛苦了！";
    $("doneOverlay").classList.add("show");playChime();
    if(navigator.vibrate)navigator.vibrate([200,100,200,100,400]);
  }

  /* ================= 时间弹窗（当前步） ================= */
  function openTimeModal(){
    if(!RT||RT.activeIdx<0)return;editingIdx=RT.activeIdx;var s=RT.steps[editingIdx];
    $("minInput").value=Math.floor(s.duration/60);$("secInput").value=s.duration%60;
    $("timeOverlay").classList.add("show");
  }
  $("quickRow").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;$("minInput").value=b.dataset.min;$("secInput").value=0;});
  $("saveTimeBtn").addEventListener("click",function(){
    var s=RT.steps[editingIdx],m=Math.max(0,Math.min(180,+$("minInput").value||0)),sec=Math.max(0,Math.min(59,+$("secInput").value||0)),d=m*60+sec;if(d<5)d=5;
    s.duration=d;if(!s.running)s.remain=d;
    $("timeOverlay").classList.remove("show");renderFocus();renderRow(editingIdx);toast("本步已设为 "+fmt(d));
  });
  $("resetDefaultBtn").addEventListener("click",function(){
    var s=RT.steps[editingIdx];s.duration=s.def;if(!s.running)s.remain=s.def;
    $("timeOverlay").classList.remove("show");renderFocus();renderRow(editingIdx);toast("已恢复默认时长");
  });

  /* ================= 聚焦卡按钮 + 全局控制 ================= */
  $("fToggle").addEventListener("click",toggleCurrent);
  $("fDone").addEventListener("click",finishCurrent);
  $("fVal").addEventListener("click",openTimeModal);
  $("resetStepBtn").addEventListener("click",function(){$("timeOverlay").classList.remove("show");resetCurrent();});

  $("resetAll").addEventListener("click",function(){
    RT.steps.forEach(function(s,i){pauseAt(i);s.done=false;s.duration=s.def;s.remain=s.def;s.running=false;renderRow(i);});
    RT.activeIdx=0;timeupStep=-1;renderAllRows();renderFocus();renderProgress();
    $("timeupOverlay").classList.remove("show");$("doneOverlay").classList.remove("show");
    $("scroll").scrollTo({top:0,behavior:"smooth"});toast("已重置全部步骤");
  });
  $("autoToggle").addEventListener("click",function(){RT.autoNext=!RT.autoNext;$("autoToggle").classList.toggle("on",RT.autoNext);toast(RT.autoNext?"已开启：到点自动进入下一步":"已关闭：到点需手动下一步");});
  $("nextStepBtn").addEventListener("click",completeAndNext);
  $("stayBtn").addEventListener("click",function(){clearTimeout(window._autoNextT);$("timeupOverlay").classList.remove("show");toast("计时已停在 00:00，点「完成本步」继续");});
  $("cookAgainBtn").addEventListener("click",function(){$("doneOverlay").classList.remove("show");$("resetAll").click();});
  $("backListBtn").addEventListener("click",function(){$("doneOverlay").classList.remove("show");backToList();});

  /* ================= 初始化 ================= */
  renderCats();renderDishes();
})();
</script>
</body>
</html>
